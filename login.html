<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - syndiki.online Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: var(--bg-alt); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-xl); width: 100%; max-width: 400px; border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-family: inherit; }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="assets/logo.png" alt="Logo" style="height: 40px; mix-blend-mode: multiply;">
            <h1 style="font-size: 1.5rem; margin-top: 15px;">Espace Admin</h1>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email professionnel</label>
                <input type="email" id="email" required placeholder="info@syndiki.online">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-full" style="padding: 14px;">Se connecter</button>
            <div id="errorMessage" style="color: red; margin-top: 15px; text-align: center; font-size: 0.9rem;"></div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('errorMessage');

            try {
                const apiBase = window.location.port === '3000' ? '' : 'http://localhost:3000';
                const response = await fetch(apiBase + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (response.ok) {
                    window.location.href = 'admin.html';
                } else {
                    error.textContent = 'Identifiants invalides';
                }
            } catch (err) {
                error.textContent = 'Erreur de connexion au serveur';
            }
        });
    </script>
</body>
</html>
